services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MOVILIDAD_MYSQL_ROOT_PASSWORD:?Configura MOVILIDAD_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: local_contabilidad
      MYSQL_USER: ${MOVILIDAD_MYSQL_USER:?Configura MOVILIDAD_MYSQL_USER}
      MYSQL_PASSWORD: ${MOVILIDAD_MYSQL_PASSWORD:?Configura MOVILIDAD_MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--host=127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  movilidad-api:
    build: ./backend
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: ${MOVILIDAD_DOCKER_CONNECTION:?Configura MOVILIDAD_DOCKER_CONNECTION}
    ports:
      - "127.0.0.1:5080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  movilidad-web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5080
    ports:
      - "127.0.0.1:5173:8080"
    depends_on:
      - movilidad-api

volumes:
  mysql-data:
